<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的 API · 漫剧工作室</title>
  <link rel="icon" type="image/png" href="/static/site-icon.png">
  <link rel="apple-touch-icon" href="/static/site-icon.png">
  <style>
    :root{--bg:#0a0612;--surface:#0f0a1c;--surface2:#160e29;--border:rgba(168,85,247,.22);--text:#f0e6ff;--dim:#9d8db8;--accent:#a855f7;--good:#4ecb71;--bad:#f06565}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.top{height:58px;display:flex;align-items:center;padding:0 max(22px,calc((100% - 1220px)/2));border-bottom:1px solid var(--border);background:var(--surface);gap:12px}.top b{font-size:17px}.spacer{flex:1}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}main{max-width:1220px;margin:0 auto;padding:28px 22px 60px}h1{font-size:26px;margin:0 0 6px}h2{font-size:17px;margin:0}.sub{color:var(--dim);margin:0}.notice{margin-top:18px;padding:15px 17px;background:#1d1436;border:1px solid rgba(168,85,247,.36);border-radius:10px;line-height:1.7}.summary{display:flex;gap:10px;margin-top:14px}.pill{padding:6px 10px;border-radius:20px;background:var(--surface2);color:var(--dim)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}.api-title{display:flex;align-items:center;gap:9px;margin-bottom:14px}.api-title .pill{font-size:11px;padding:3px 7px;margin-left:auto}label{display:block;color:var(--dim);font-size:12px;margin-top:11px}input,select{width:100%;margin-top:5px;padding:10px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);outline:none}.help{display:block;color:#675879;font-size:11px;margin-top:6px;line-height:1.5}.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}.status{min-height:34px;margin-top:10px;color:var(--dim);font-size:12px;line-height:1.5}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:880px){.grid{grid-template-columns:1fr}.top{padding:0 16px}main{padding:22px 14px}}
  </style>
  <style>
    .saved-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.saved-empty{padding:12px;border:1px dashed var(--border);border-radius:8px;color:var(--dim);font-size:12px;text-align:center}.saved-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}.saved-item.current{border-color:var(--accent);background:#251a45}.saved-main{min-width:0;flex:1;cursor:pointer}.saved-main strong,.saved-main small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-main small{color:var(--dim);margin-top:2px}.mini{padding:5px 7px;font-size:11px}.danger{color:var(--bad)}.editor-title{display:flex;align-items:center;gap:8px;margin:12px 0 4px;color:var(--dim);font-size:12px}.editor-title span{flex:1}.card .count{margin-left:auto;color:var(--dim);font-size:11px}.current-mark{color:var(--good);font-size:10px}.endpoint-box{margin-top:12px;padding:11px;border:1px solid rgba(168,85,247,.34);border-radius:9px;background:#130b25}.endpoint-box label:first-child{margin-top:0}.endpoint-box[hidden],label[hidden]{display:none!important}
  </style>
</head>
<body>
  <header class="top"><span>🎬</span><b>漫剧工作室 · 我的 API</b><div class="spacer"></div><button class="btn" onclick="document.referrer.indexOf(location.origin)===0?window.history.back():location.assign('/')">返回工作台</button></header>
  <main>
    <h1>我的 API</h1>
    <p class="sub">每个账号可以保存多个接口配置；密钥只保存在当前账号中，其他账号看不到。</p>
    <div class="notice">平台内置模型按管理员设置的单价扣分；积分不足时可在工作台选择你接入的个人 API，个人 API 不扣平台积分。</div>
    <div class="summary"><span class="pill" id="points">积分：--</span><span class="pill" id="routeState">当前线路：--</span></div>
    <div class="grid" id="apiGrid"></div>
  </main>
  <script>
    const p=(id,label,base='',model='')=>({id,label,base,model});
    const TYPES={
      text:{title:'文本 API',icon:'✍️',help:'使用 OpenAI Chat Completions 兼容协议',providers:[
        p('openai','OpenAI','https://api.openai.com/v1','gpt-4.1-mini'),p('deepseek','DeepSeek','https://api.deepseek.com/v1','deepseek-chat'),
        p('anthropic','Anthropic Claude','https://api.anthropic.com/v1','claude-sonnet-4-5'),p('gemini','Google Gemini','https://generativelanguage.googleapis.com/v1beta/openai','gemini-2.5-flash'),
        p('xai','xAI Grok','https://api.x.ai/v1','grok-3-mini'),
        p('openrouter','OpenRouter','https://openrouter.ai/api/v1','openai/gpt-4.1-mini'),p('siliconflow','硅基流动','https://api.siliconflow.cn/v1','deepseek-ai/DeepSeek-V3'),
        p('dashscope','通义千问 DashScope','https://dashscope.aliyuncs.com/compatible-mode/v1','qwen-plus'),p('moonshot','Moonshot / Kimi','https://api.moonshot.cn/v1','moonshot-v1-8k'),
        p('zhipu','智谱 GLM','https://open.bigmodel.cn/api/paas/v4','glm-4-flash'),p('minimax','MiniMax','https://api.minimax.chat/v1','MiniMax-M2.1'),
        p('atlas','Atlas Cloud（全模型）','https://api.atlascloud.ai/api/v1','bytedance/doubao-seed-2.1-turbo-260628'),
        p('nano','Nano-GPT','https://nano-gpt.com/api/v1','openai/gpt-4.1-mini'),p('ark','火山 Ark','https://ark.cn-beijing.volces.com/api/v3',''),p('custom','Custom API')
      ]},
      image:{title:'图片生成 API',icon:'🎨',help:'使用 OpenAI Images 兼容协议',providers:[
        p('atlas','Atlas Cloud（全模型）','https://api.atlascloud.ai/api/v1','bytedance/seedream-v5.0-pro/text-to-image'),
        p('openai','OpenAI','https://api.openai.com/v1','gpt-image-1'),p('nano','Nano-GPT','https://nano-gpt.com/api/v1','gpt-image-2'),
        p('siliconflow','硅基流动','https://api.siliconflow.cn/v1','black-forest-labs/FLUX.1-schnell'),p('agnes','Agnes API Hub','https://apihub.agnes-ai.com/v1','agnes-image-2.1-flash'),
        p('ark','火山 Seedream','https://ark.cn-beijing.volces.com/api/v3',''),p('custom','Custom API')
      ]},
      video:{title:'视频生成 API',icon:'🎥',help:'内置服务商使用现有适配器；新建 Custom API 只需填写一个完整接口 URL',providers:[
        p('atlas','Atlas Cloud（全模型）','https://api.atlascloud.ai/api/v1','bytedance/seedance-2.0-mini/text-to-video'),
        p('agnes','Agnes API Hub','https://apihub.agnes-ai.com/v1','agnes-video-v2.0'),p('nano','Nano-GPT','https://nano-gpt.com/api/v1','kling-v30-std'),
        p('minimax','MiniMax H3','https://api.minimaxi.com','MiniMax-H3'),
        p('ark','火山 Seedance','https://ark.cn-beijing.volces.com/api/v3',''),p('custom','Custom API')
      ]}
    };
    function providerHelp(kind,provider,fallback){if(provider==='custom')return '把服务商提供的完整接口 URL 粘贴一次即可，系统不会再让你填写 Base URL 或查询 URL';if(kind==='video'&&provider==='minimax')return '自动调用 /v2/video_generation，并通过 /v2/query/video_generation/{task_id} 查询结果';if(provider!=='atlas')return fallback;if(kind==='text')return 'Atlas Cloud 文本使用 OpenAI 兼容协议';if(kind==='image')return '自动调用 Atlas Cloud 图片生成与任务查询接口';return '自动调用 Atlas Cloud 视频生成与任务查询接口';}
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let apiData={api_profiles:{},selected_api_profiles:{}},editing={text:null,image:null,video:null};
    const providerLabel=(kind,id)=>(TYPES[kind].providers.find(x=>x.id===id)||{}).label||id||'Custom API';
    const profileSummary=(kind,a)=>[providerLabel(kind,a.provider),a.model].filter(Boolean).join(' · ');
    async function loadApis(){
      const r=await fetch('/api/settings'),d=await r.json();
      if(!r.ok){apiGrid.innerHTML='<div class="bad">'+esc(d.error||'加载失败')+'</div>';return;}
      apiData=d;
      points.textContent=d.unlimited_points?'积分：管理员不限':'积分：'+(d.points||0);
      routeState.textContent=d.unlimited_points?'计费：管理员免积分':'计费：内置模型按后台定价';
      Object.keys(TYPES).forEach(kind=>{const profiles=d.api_profiles[kind]||[],active=d.selected_api_profiles[kind];editing[kind]=profiles.some(x=>x.id===active)?active:(profiles[0]||{}).id||null;});
      apiGrid.innerHTML=Object.keys(TYPES).map(renderCard).join('');
      Object.keys(TYPES).forEach(fillEditor);
    }
    function renderCard(kind){
      const t=TYPES[kind],profiles=apiData.api_profiles[kind]||[],active=apiData.selected_api_profiles[kind];
      const rows=profiles.length?profiles.map(a=>`<div class="saved-item ${a.id===active?'current':''}"><div class="saved-main" onclick="editProfile('${kind}','${a.id}')"><strong>${esc(a.name)}</strong><small>${esc(profileSummary(kind,a))}</small></div>${a.id===active?'<span class="current-mark">当前</span>':`<button class="btn mini" onclick="selectProfile('${kind}','${a.id}')">使用</button>`}<button class="btn mini danger" onclick="deleteProfile('${kind}','${a.id}')">删除</button></div>`).join(''):'<div class="saved-empty">还没有保存接口</div>';
      const endpointPlaceholder=kind==='video'?'https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/video-generation/video-synthesis':'https://api.example.com/v1/generate';
      return `<div class="card"><div class="api-title"><span>${t.icon}</span><h2>${t.title}</h2><span class="count">已保存 ${profiles.length} 个</span></div><div class="saved-list">${rows}</div><div class="editor-title"><span id="${kind}EditorTitle">新增接口</span><button class="btn mini" onclick="newProfile('${kind}')">＋ 新增</button></div><label>工作台显示名称（可自定义）<input id="${kind}Name" placeholder="例如：我的主视频接口"></label><label>接口服务商<select id="${kind}Provider" onchange="applyPreset('${kind}')">${t.providers.map(x=>`<option value="${x.id}">${x.label}</option>`).join('')}</select></label><small class="help" id="${kind}Help">${t.help}</small><label id="${kind}BaseLabel">Base URL<input id="${kind}Base" placeholder="https://example.com/v1"></label><div class="endpoint-box" id="${kind}EndpointBox" hidden><label>完整接口 URL<input id="${kind}SubmitUrl" placeholder="${endpointPlaceholder}"></label><small class="help" id="${kind}EndpointHelp">只粘贴服务商给出的完整接口地址，其他地址由系统处理。</small></div><label>API Key<input id="${kind}Key" type="password" placeholder="请输入 API Key"></label><label>模型名称<input id="${kind}Model" placeholder="model-id"></label><div class="row"><button class="btn primary" onclick="saveApi('${kind}')">保存并设为当前</button><button class="btn" onclick="testApi('${kind}')">测试连接</button></div><div class="status" id="${kind}Status"></div></div>`;
    }
    function toggleEndpointFields(kind,profile){const provider=document.getElementById(kind+'Provider').value,isCustom=provider==='custom';document.getElementById(kind+'EndpointBox').hidden=!isCustom;document.getElementById(kind+'BaseLabel').hidden=isCustom;if(isCustom){document.getElementById(kind+'EndpointHelp').textContent=profile&&!profile.endpoint_mode?'这是已有兼容配置，留空仍按原配置运行；需要更换时粘贴一个完整接口 URL。':'只粘贴一次完整接口 URL，提交和任务查询由系统处理。';}}
    function fillEditor(kind){const profiles=apiData.api_profiles[kind]||[],a=profiles.find(x=>x.id===editing[kind]);if(!a){newProfile(kind);return;}const provider=TYPES[kind].providers.some(x=>x.id===a.provider)?a.provider:'custom';document.getElementById(kind+'EditorTitle').textContent='编辑：'+a.name;document.getElementById(kind+'Name').value=a.name||'';document.getElementById(kind+'Provider').value=provider;document.getElementById(kind+'Base').value=a.base_url||'';document.getElementById(kind+'SubmitUrl').value=a.submit_url||'';document.getElementById(kind+'Model').value=a.model||'';document.getElementById(kind+'Key').value='';document.getElementById(kind+'Key').placeholder=a.configured?'已保存，留空不修改':'请输入 API Key';document.getElementById(kind+'Help').textContent=providerHelp(kind,provider,TYPES[kind].help);document.getElementById(kind+'Status').textContent=a.last_test?'上次连接成功：'+new Date(a.last_test).toLocaleString():'';toggleEndpointFields(kind,a);}
    function editProfile(kind,id){editing[kind]=id;fillEditor(kind);}
    function newProfile(kind){editing[kind]=null;const preset=TYPES[kind].providers[0];document.getElementById(kind+'EditorTitle').textContent='新增接口';document.getElementById(kind+'Name').value='';document.getElementById(kind+'Provider').value=preset.id;document.getElementById(kind+'Base').value=preset.base;document.getElementById(kind+'SubmitUrl').value='';document.getElementById(kind+'Model').value=preset.model;document.getElementById(kind+'Key').value='';document.getElementById(kind+'Key').placeholder='请输入 API Key';document.getElementById(kind+'Help').textContent=providerHelp(kind,preset.id,TYPES[kind].help);document.getElementById(kind+'Status').textContent='';toggleEndpointFields(kind,null);}
    function applyPreset(kind){const provider=document.getElementById(kind+'Provider').value,preset=TYPES[kind].providers.find(x=>x.id===provider);if(!preset)return;document.getElementById(kind+'Base').value=preset.base;document.getElementById(kind+'SubmitUrl').value='';document.getElementById(kind+'Model').value=preset.model;document.getElementById(kind+'Help').textContent=providerHelp(kind,provider,TYPES[kind].help);toggleEndpointFields(kind,null);}
    async function saveApi(kind){
      const body={kind,profile_id:editing[kind],name:document.getElementById(kind+'Name').value,provider:document.getElementById(kind+'Provider').value,base_url:document.getElementById(kind+'Base').value,submit_url:document.getElementById(kind+'SubmitUrl').value,api_key:document.getElementById(kind+'Key').value,model:document.getElementById(kind+'Model').value};
      const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json(),s=document.getElementById(kind+'Status');
      s.className='status '+(r.ok?'good':'bad');s.textContent=r.ok?'保存成功，工作台已可选择':d.error||'保存失败';if(r.ok){editing[kind]=d.selected_profile_id;setTimeout(loadApis,400);}
    }
    async function testApi(kind){
      if(!editing[kind]){document.getElementById(kind+'Status').className='status bad';document.getElementById(kind+'Status').textContent='请先保存接口';return;}
      const s=document.getElementById(kind+'Status');s.className='status';s.textContent='正在连接…';
      const r=await fetch('/api/settings/'+kind+'/'+editing[kind]+'/test',{method:'POST'}),d=await r.json();s.className='status '+(r.ok?'good':'bad');s.textContent=d.message||d.error||'测试失败';
    }
    async function selectProfile(kind,id){const r=await fetch('/api/settings/'+kind+'/'+id+'/select',{method:'POST'}),d=await r.json();if(!r.ok){alert(d.error||'切换失败');return;}editing[kind]=id;loadApis();}
    async function deleteProfile(kind,id){if(!confirm('确认删除这个接口配置？'))return;const r=await fetch('/api/settings/'+kind+'/'+id,{method:'DELETE'}),d=await r.json();if(!r.ok){alert(d.error||'删除失败');return;}editing[kind]=null;loadApis();}
    loadApis();
  </script>
</body>
</html>
