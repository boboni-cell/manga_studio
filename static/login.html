<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号登录 · 漫剧工作室</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#263760,#0c0c10 45%);color:#ededf5;font:14px system-ui}.card{width:min(420px,calc(100% - 32px));padding:32px;background:#16161df5;border:1px solid #34344a;border-radius:16px;box-shadow:0 24px 70px #0008}.brand{display:flex;gap:10px;align-items:center;color:#9d9db5}.brand b{font-size:18px;color:#fff}h1{font-size:24px;margin:26px 0 8px}p{color:#9d9db5;line-height:1.7;margin:0 0 20px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#101016;border-radius:9px}.tabs button{margin:0;background:transparent;color:#89899f}.tabs .active{background:#29293a;color:#fff}label{display:block;margin-top:13px;font-size:12px;color:#c6c6d5}input,button{width:100%;padding:11px 12px;border-radius:8px;font:inherit}input{margin-top:6px;color:#fff;background:#1e1e28;border:1px solid #3a3a50;outline:none}input:focus{border-color:#6c98f3;box-shadow:0 0 0 3px #5b8def22}button{margin-top:18px;border:0;background:#5b8def;color:#fff;cursor:pointer;font-weight:600}.error{min-height:20px;margin-top:12px;color:#ff7c7c}.hidden{display:none}.note{text-align:center;font-size:11px;color:#6f6f86;margin:18px 0 0}
</style></head><body><main class="card"><div class="brand"><span>🎬</span><b>漫剧工作室</b><span>个人创作空间</span></div><h1 id="title">欢迎回来</h1><p id="hint">登录后只会看到你自己的素材与生成记录。</p><div class="tabs"><button id="loginTab" class="active" type="button">登录</button><button id="registerTab" type="button">邀请码注册</button></div><form id="form"><label>邮箱或用户名<input id="username" autocomplete="username" placeholder="name@example.com" required></label><label>密码<input id="password" type="password" minlength="8" required placeholder="至少 8 位"></label><label id="confirmWrap" class="hidden">确认密码<input id="confirmPassword" type="password" placeholder="再次输入密码"></label><label id="inviteWrap" class="hidden">邀请码<input id="inviteCode" placeholder="请输入管理员发放的邀请码"></label><div id="error" class="error" role="alert"></div><button id="submitButton">登录</button></form><p class="note">邀请码决定可使用的文本、图片与视频模型权限</p></main><script>
const $=id=>document.getElementById(id),form=$('form'),username=$('username'),password=$('password'),confirmPassword=$('confirmPassword'),inviteCode=$('inviteCode'),errorBox=$('error'),submitButton=$('submitButton');let registering=false;function setMode(v){registering=v;$('loginTab').classList.toggle('active',!v);$('registerTab').classList.toggle('active',v);$('confirmWrap').classList.toggle('hidden',!v);$('inviteWrap').classList.toggle('hidden',!v);confirmPassword.required=inviteCode.required=v;$('title').textContent=v?'使用邀请码注册':'欢迎回来';$('hint').textContent=v?'邀请码会自动为账号开通对应模型权限。':'登录后只会看到你自己的素材与生成记录。';submitButton.textContent=v?'注册并进入':'登录';errorBox.textContent=''}$('loginTab').onclick=()=>setMode(false);$('registerTab').onclick=()=>setMode(true);form.onsubmit=async e=>{e.preventDefault();if(registering&&password.value!==confirmPassword.value){errorBox.textContent='两次密码不一致';return}submitButton.disabled=true;errorBox.textContent='';try{const r=await fetch('/api/auth/'+(registering?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value,invite_code:inviteCode.value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'操作失败');location.href='/'}catch(e){errorBox.textContent=e.message}finally{submitButton.disabled=false;submitButton.textContent=registering?'注册并进入':'登录'}};
</script></body></html>
