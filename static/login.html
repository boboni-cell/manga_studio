<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 漫剧工作室</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0c10;color:#e4e4ed;font:14px system-ui}.card{width:min(360px,calc(100% - 40px));padding:28px;background:#16161d;border:1px solid #2a2a3a;border-radius:12px}h1{font-size:21px;margin:0 0 8px}p{color:#9d9db5;margin:0 0 22px}input,button{box-sizing:border-box;width:100%;padding:11px 12px;margin-top:10px;border-radius:7px;font:inherit}input{color:#fff;background:#1e1e28;border:1px solid #353550}button{color:#fff;background:#5b8def;border:0;cursor:pointer}.switch{background:transparent;color:#9d9db5;border:1px solid #353550}.error{min-height:20px;color:#f06565;margin-top:10px}
</style></head><body><main class="card"><h1>🎬 漫剧工作室</h1><p id="hint">登录后只会看到你自己的素材和生成记录</p><form id="form"><input id="username" autocomplete="username" placeholder="用户名" required><input id="password" type="password" autocomplete="current-password" placeholder="密码（至少 8 位）" required><div class="error" id="error"></div><button id="submit">登录</button></form><button class="switch" id="switch" type="button">没有账号？注册</button></main><script>
let registering=false;document.getElementById('switch').onclick=()=>{registering=!registering;submit.textContent=registering?'注册并登录':'登录';switch.textContent=registering?'已有账号？登录':'没有账号？注册';error.textContent=''};form.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/auth/'+(registering?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(r.ok)location.href='/';else error.textContent=d.error||'操作失败'};
</script></body></html>
