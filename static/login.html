<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号登录 · 漫剧工作室</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -20%,#25345f 0,#0c0c10 44%);color:#e9e9f2;font:14px system-ui,-apple-system,sans-serif}.card{width:min(410px,calc(100% - 32px));padding:32px;background:rgba(22,22,29,.96);border:1px solid #34344a;border-radius:16px;box-shadow:0 24px 70px #0008}.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:#9d9db5}.brand b{font-size:18px;color:#fff}h1{font-size:24px;margin:28px 0 8px}p{color:#9d9db5;margin:0 0 20px;line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#101016;padding:4px;border-radius:9px;margin-bottom:14px}.tabs button{margin:0;background:transparent;color:#89899f}.tabs button.active{background:#29293a;color:#fff}label{display:block;margin-top:13px;color:#c6c6d5;font-size:12px}input,button{width:100%;padding:11px 12px;border-radius:8px;font:inherit}input{margin-top:6px;color:#fff;background:#1e1e28;border:1px solid #3a3a50;outline:none}input:focus{border-color:#6c98f3;box-shadow:0 0 0 3px #5b8def22}button{margin-top:18px;color:#fff;background:#5b8def;border:0;cursor:pointer;font-weight:600}.error{min-height:20px;color:#ff7c7c;margin-top:12px}.privacy{font-size:11px;color:#6f6f86;text-align:center;margin:18px 0 0}.hidden{display:none}
</style></head><body><main class="card"><div class="brand"><span>🎬</span><b>漫剧工作室</b><span>个人创作空间</span></div><h1 id="title">欢迎回来</h1><p id="hint">登录后只会看到你自己的素材、API 配置和生成记录。</p><div class="tabs"><button id="loginTab" class="active" type="button">登录</button><button id="registerTab" type="button">注册</button></div><form id="authForm"><label>邮箱或用户名<input id="username" autocomplete="username" placeholder="name@example.com" required></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位" minlength="8" required></label><label id="confirmWrap" class="hidden">确认密码<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码"></label><div class="error" id="error" role="alert"></div><button id="submitButton">登录</button></form><p class="privacy">账号数据相互隔离 · API 密钥不会在页面中明文显示</p></main><script>
const form=document.getElementById('authForm'),username=document.getElementById('username'),password=document.getElementById('password'),confirmPassword=document.getElementById('confirmPassword'),confirmWrap=document.getElementById('confirmWrap'),errorBox=document.getElementById('error'),submitButton=document.getElementById('submitButton'),loginTab=document.getElementById('loginTab'),registerTab=document.getElementById('registerTab');let registering=false;
function setMode(value){registering=value;loginTab.classList.toggle('active',!value);registerTab.classList.toggle('active',value);confirmWrap.classList.toggle('hidden',!value);confirmPassword.required=value;password.autocomplete=value?'new-password':'current-password';document.getElementById('title').textContent=value?'创建个人空间':'欢迎回来';document.getElementById('hint').textContent=value?'注册后，你的素材、生成记录和 API 配置将与其他用户完全分开。':'登录后只会看到你自己的素材、API 配置和生成记录。';submitButton.textContent=value?'注册并进入工作台':'登录';errorBox.textContent=''}
loginTab.onclick=()=>setMode(false);registerTab.onclick=()=>setMode(true);form.onsubmit=async e=>{e.preventDefault();errorBox.textContent='';if(registering&&password.value!==confirmPassword.value){errorBox.textContent='两次输入的密码不一致';return}submitButton.disabled=true;submitButton.textContent='处理中…';try{const r=await fetch('/api/auth/'+(registering?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'操作失败');location.href='/'}catch(err){errorBox.textContent=err.message}finally{submitButton.disabled=false;submitButton.textContent=registering?'注册并进入工作台':'登录'}};
</script></body></html>
