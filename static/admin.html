<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台管理 · 漫剧工作室</title><style>
:root{--bg:#0c0c10;--surface:#16161d;--surface2:#1e1e28;--border:#303044;--text:#e8e8f1;--dim:#9d9db5;--accent:#5b8def;--good:#4ecb71;--bad:#f06565}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.top{height:58px;display:flex;align-items:center;padding:0 max(22px,calc((100% - 1220px)/2));border-bottom:1px solid var(--border);background:var(--surface);gap:12px}.top b{font-size:17px}.spacer{flex:1}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}main{max-width:1220px;margin:0 auto;padding:28px 22px 60px}h1{font-size:26px;margin:0 0 6px}h2{font-size:17px;margin:0}.sub{color:var(--dim);margin:0}.section{margin-top:26px}.section-head{display:flex;align-items:end;gap:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}.api-title{display:flex;align-items:center;gap:9px;margin-bottom:14px}.pill{font-size:11px;padding:3px 7px;border-radius:20px;background:#24243a;color:var(--dim)}label{display:block;color:var(--dim);font-size:12px;margin-top:11px}input,select{width:100%;margin-top:5px;padding:10px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);outline:none}.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}.status{min-height:20px;margin-top:10px;color:var(--dim);font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}th{color:var(--dim);font-size:12px}.form-row{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:10px;align-items:end}.checks{display:flex;gap:12px;margin-top:8px}.checks label{margin:0;color:var(--text)}.checks input{width:auto;margin:0}.empty{color:var(--dim);text-align:center;padding:24px}@media(max-width:900px){.grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.top{padding:0 16px}main{padding:22px 14px}table{display:block;overflow:auto}}
</style></head><body><header class="top"><span>🎬</span><b>漫剧工作室 · 后台管理</b><div class="spacer"></div><button class="btn" onclick="location.href='/'">返回工作台</button></header><main><h1>后台管理</h1><p class="sub">统一管理模型接口、邀请码与用户权限。API 密钥不会回显。</p>
<section class="section"><div class="section-head"><div><h2>模型 API 接入</h2><p class="sub">文本、图片、视频各使用一套独立接口；保存后工作台立即读取。</p></div></div><div class="grid" id="apiGrid"></div></section>
<section class="section"><div class="section-head"><div><h2>发放邀请码</h2><p class="sub">选择邀请码能开放的模型权限；积分先记录，暂不扣费。</p></div></div><div class="card"><div class="form-row"><label>自定义邀请码（可留空）<input id="inviteCode" placeholder="自动生成"></label><label>最大使用次数<input id="maxUses" type="number" min="1" value="1"></label><label>初始积分<input id="points" type="number" min="0" value="0"></label><button class="btn primary" onclick="createInvite()">生成邀请码</button></div><div class="checks"><label><input type="checkbox" name="perm" value="text" checked> 文本模型</label><label><input type="checkbox" name="perm" value="image" checked> 图片模型</label><label><input type="checkbox" name="perm" value="video" checked> 视频模型</label></div><div id="inviteMessage" class="status"></div></div><div style="margin-top:12px;overflow:auto"><table><thead><tr><th>邀请码</th><th>权限</th><th>积分</th><th>使用</th><th>状态</th><th>操作</th></tr></thead><tbody id="inviteRows"></tbody></table></div></section>
<section class="section"><div class="section-head"><div><h2>用户管理</h2><p class="sub" id="userSummary">加载中…</p></div></div><div style="overflow:auto"><table><thead><tr><th>账号</th><th>注册时间</th><th>模型权限</th><th>积分</th><th>记录</th><th>状态</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div></section></main><script>
const TYPES={text:{title:'文本 API',icon:'✍️',providers:[['ark','火山 Ark'],['nano','Nano-GPT'],['openai','OpenAI 兼容']]},image:{title:'图片生成 API',icon:'🎨',providers:[['ark','火山 Seedream'],['nano','Nano-GPT'],['openai','OpenAI 兼容']]},video:{title:'视频生成 API',icon:'🎥',providers:[['ark','火山 Seedance'],['nano','Nano-GPT'],['generic','通用视频接口']]}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadApis(){const d=await fetch('/api/admin/apis').then(r=>r.json());apiGrid.innerHTML=Object.entries(TYPES).map(([kind,t])=>{const a=d.apis[kind];return `<div class="card"><div class="api-title"><span>${t.icon}</span><h2>${t.title}</h2><span class="pill">${a.configured?'已配置':'未配置'}</span></div><label>接口类型<select id="${kind}Provider">${t.providers.map(p=>`<option value="${p[0]}" ${a.provider===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></label><label>Base URL<input id="${kind}Base" value="${esc(a.base_url)}" placeholder="https://.../v1"></label><label>API Key<input id="${kind}Key" type="password" placeholder="${a.configured?'已保存，留空不修改':'请输入 API Key'}"></label><label>模型名称<input id="${kind}Model" value="${esc(a.model)}" placeholder="model-id"></label><div class="row"><button class="btn primary" onclick="saveApi('${kind}')">保存</button><button class="btn" onclick="testApi('${kind}')">测试连接</button></div><div class="status" id="${kind}Status">${a.last_test?'上次连接成功：'+new Date(a.last_test).toLocaleString():''}</div></div>`}).join('')}
async function saveApi(k){const body={kind:k,provider:document.getElementById(k+'Provider').value,base_url:document.getElementById(k+'Base').value,api_key:document.getElementById(k+'Key').value,model:document.getElementById(k+'Model').value};const r=await fetch('/api/admin/apis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json(),s=document.getElementById(k+'Status');s.className='status '+(r.ok?'good':'bad');s.textContent=r.ok?'保存成功':d.error||'保存失败';if(r.ok)document.getElementById(k+'Key').value=''}
async function testApi(k){const s=document.getElementById(k+'Status');s.className='status';s.textContent='正在连接…';const r=await fetch('/api/admin/apis/'+k+'/test',{method:'POST'}),d=await r.json();s.className='status '+(r.ok?'good':'bad');s.textContent=d.message||d.error}
async function loadInvites(){const d=await fetch('/api/admin/invitations').then(r=>r.json());inviteRows.innerHTML=d.invitations.length?d.invitations.map(i=>`<tr><td><b>${esc(i.code)}</b></td><td>${i.permissions.map(x=>({text:'文本',image:'图片',video:'视频'}[x])).join('、')||'无'}</td><td>${i.points||0}</td><td>${i.used||0}/${i.max_uses}</td><td>${i.active?'可用':'停用'}</td><td><button class="btn" onclick="setInvite('${esc(i.code)}',${!i.active})">${i.active?'停用':'启用'}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无邀请码</td></tr>'}
async function createInvite(){const permissions=[...document.querySelectorAll('[name=perm]:checked')].map(x=>x.value);const r=await fetch('/api/admin/invitations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:inviteCode.value,max_uses:maxUses.value,points:points.value,permissions})}),d=await r.json();inviteMessage.className='status '+(r.ok?'good':'bad');inviteMessage.textContent=r.ok?'邀请码已生成':d.error||'生成失败';if(r.ok){inviteCode.value='';loadInvites()}}
async function setInvite(code,active){await fetch('/api/admin/invitations/'+encodeURIComponent(code)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});loadInvites()}
async function loadUsers(){const d=await fetch('/api/admin/users').then(r=>r.json());userSummary.textContent='共 '+d.total+' 个账号';userRows.innerHTML=d.users.map(u=>`<tr><td>${esc(u.username)}${u.is_admin?'<div class="good">管理员</div>':''}</td><td>${u.created_at?new Date(u.created_at).toLocaleString():'-'}</td><td>${(u.permissions||[]).join(' / ')||'-'}</td><td>${u.points||0}</td><td>${u.history_count}</td><td>${u.disabled?'已停用':'正常'}</td><td>${u.is_admin?'—':`<button class="btn" onclick="setUser('${encodeURIComponent(u.id)}',${!u.disabled})">${u.disabled?'启用':'停用'}</button>`}</td></tr>`).join('')}
async function setUser(id,disabled){await fetch('/api/admin/users/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({disabled})});loadUsers()}loadApis();loadInvites();loadUsers();
</script></body></html>
