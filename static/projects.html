<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目 · Manga Studio</title>
    <link rel="icon" type="image/png" href="/static/site-icon.png" />
    <link rel="stylesheet" href="/static/projects.css" />
  </head>
  <body>
    <div class="p-shell">
      <aside class="p-side">
        <div class="p-brand">🎬 Manga Studio</div>
        <nav class="p-nav">
          <button class="active" id="navProjects">项目</button>
          <button onclick="location.href='/assets'">资产</button>
          <button onclick="location.href='/api-settings'">API 设置</button>
          <button id="navTrash">回收站</button>
          <button id="navAdmin" hidden>后台管理</button>
          <button id="navLogout">退出</button>
        </nav>
      </aside>
      <main class="p-main">
        <header class="p-head">
          <h1>欢迎回来</h1>
          <button class="p-create" id="createProject">＋ 新建项目</button>
          <button class="p-import" id="importProject">导入项目</button>
        </header>
        <section class="p-grid" id="projectGrid"></section>
      </main>
    </div>
    <script src="/static/projects.js"></script>
  </body>
</html>
